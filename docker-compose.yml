x-batman-node: &batman-node
  image: ubuntu:22.04
  privileged: true
  cap_add:
    - NET_ADMIN
    - SYS_MODULE
  volumes:
    - /lib/modules:/lib/modules:ro
  networks:
    - manet
  command: ["bash", "-c", "sleep infinity"]

services:
  node1:
    <<: *batman-node
    container_name: node1
    hostname: node1
  node2:
    <<: *batman-node
    container_name: node2
    hostname: node2
  node3:
    <<: *batman-node
    container_name: node3
    hostname: node3

networks:
  manet:
    driver: bridge
