x-batman-node: &batman-node
  image: ubuntu:22.04
  privileged: true
  cap_add:
    - NET_ADMIN
    - SYS_MODULE
  networks:
    - manet
  command: ["bash", "-c", "sleep infinity"]

services:
  node1:
    <<: *batman-node
    container_name: node1
    hostname: node1
  node2:
    <<: *batman-node
    container_name: node2
    hostname: node2
  node3:
    <<: *batman-node
    container_name: node3
    hostname: node3
  node4:
    <<: *batman-node
    container_name: node4
    hostname: node4
  node5:
    <<: *batman-node
    container_name: node5
    hostname: node5
  node6:
    <<: *batman-node
    container_name: node6
    hostname: node6
  node7:
    <<: *batman-node
    container_name: node7
    hostname: node7
  node8:
    <<: *batman-node
    container_name: node8
    hostname: node8
  node9:
    <<: *batman-node
    container_name: node9
    hostname: node9
  node10:
    <<: *batman-node
    container_name: node10
    hostname: node10

networks:
  manet:
    driver: bridge
