x-batman-node: &batman-node
  build: .
  image: batman-manet-node:22.04
  privileged: true
  cap_add:
    - NET_ADMIN
    - SYS_MODULE
  sysctls:
    net.ipv4.conf.all.rp_filter: "0"
    net.ipv4.conf.default.rp_filter: "0"
  volumes:
    - /lib/modules:/lib/modules:ro
  networks:
    - manet
  command: ["sleep", "infinity"]

